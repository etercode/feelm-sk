<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f7f8fa" />
		<meta
			name="description"
			content="You Know Me — a shared log of the films, series, games and books people actually finished."
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2307080C'/><circle cx='16' cy='16' r='8.5' fill='none' stroke='%23F0C04A' stroke-width='2'/><circle cx='16' cy='16' r='3' fill='%23F0C04A'/></svg>"
		/>
		<script>
			// Set the theme before the first paint so it never flashes.
			(function () {
				try {
					var choice = localStorage.getItem('youknowme:theme') || 'light';
					var dark =
						choice === 'dark' ||
						(choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
