<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Matches --page in each theme, so the phone's chrome joins the page
		     instead of drawing a line across the top of it. -->
		<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#141826" media="(prefers-color-scheme: dark)" />
		<meta
			name="description"
			content="Feelm — a shared log of the films, series, games and books people actually finished."
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<!--
			The mark on its own navy tile. A transparent version would be a white
			F against light browser chrome, and iOS fills alpha with black on the
			home screen — one tiled asset avoids both.
		-->
		<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<script>
			// Set the theme before the first paint so it never flashes.
			(function () {
				try {
					var choice = localStorage.getItem('feelm:theme') || 'light';
					var dark =
						choice === 'dark' ||
						(choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
